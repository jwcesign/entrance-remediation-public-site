        <div class="identity" aria-label="项目主入口优化事项">

            <strong>业主沟通意见</strong>

        </div>
        <div class="topbar-actions">
          <span class="deck-count">共 9 页</span>
          <a class="button button-secondary" href="files/project-entrance-owner-opinion.pptx" download>
            下载 PPT
          </a>
        </div>
      </header>

      <main class="deck-layout" aria-label="沟通材料浏览器">
        <nav class="thumbnail-rail" aria-label="选择幻灯片">
          <button class="thumbnail is-active" type="button" data-slide="0" aria-current="page">
            <span>01</span>
            <img src="slides/slide-1.png" alt="封面缩略图" />
          </button>
          <button class="thumbnail" type="button" data-slide="1">
            <span>02</span>
            <img src="slides/slide-2.png" alt="入口体验缩略图" loading="lazy" />
          </button>
          <button class="thumbnail" type="button" data-slide="2">
            <span>03</span>
            <img src="slides/slide-3.png" alt="入口位置缩略图" loading="lazy" />
          </button>
          <button class="thumbnail" type="button" data-slide="3">
            <span>04</span>
            <img src="slides/slide-4.png" alt="销售沙盘展示与目前大门方案差异缩略图" loading="lazy" />
          </button>
          <button class="thumbnail" type="button" data-slide="4">
            <span>05</span>
            <img src="slides/slide-5.png" alt="销售展示与后续优化法律依据缩略图" loading="lazy" />
          </button>
          <button class="thumbnail" type="button" data-slide="5">
            <span>06</span>
            <img src="slides/slide-6.png" alt="小区车道车辆与大门出口行人交叉风险缩略图" loading="lazy" />
          </button>
          <button class="thumbnail" type="button" data-slide="6">
            <span>07</span>
            <img src="slides/slide-7.png" alt="优先优化内部车行路线并采用纵向花坛缩略图" loading="lazy" />
          </button>
          <button class="thumbnail" type="button" data-slide="7">
            <span>08</span>
            <img src="slides/slide-8.png" alt="车道无法优化时采用横向小花坛保底方案缩略图" loading="lazy" />
          </button>
          <button class="thumbnail" type="button" data-slide="8">
            <span>09</span>
            <img src="slides/slide-9.png" alt="保持入口整体造景品质核心诉求缩略图" loading="lazy" />
          </button>

        <section class="stage-column" id="deck-stage" tabindex="-1">
          <div class="stage-toolbar">
            <div>
              <span class="eyebrow">当前页面</span>
              <h1 id="slide-title">项目主入口优化事项</h1>
            </div>
            <div class="stage-actions" aria-label="演示控制">
              <button class="icon-button" id="previous-slide" type="button" aria-label="上一页">上一页</button>
              <span class="page-indicator" id="page-indicator" aria-live="polite">1 / 9</span>
              <button class="icon-button" id="next-slide" type="button" aria-label="下一页">下一页</button>
              <button class="icon-button" id="fullscreen-slide" type="button">全屏查看</button>
            </div>
          </div>

          <figure class="slide-stage" id="slide-stage" aria-busy="true">
            <div class="slide-loading" id="slide-loading" role="status">正在加载页面…</div>
            <img
              id="active-slide"
              src="slides/slide-1.png"
              alt="第 1 页：项目主入口优化事项封面"
              width="1600"
              height="900"
            />
            <figcaption id="slide-caption">第 1 页，共 9 页</figcaption>
            <div class="slide-error" id="slide-error" hidden>
              <strong>这一页暂时没有加载成功</strong>
              <button class="button button-secondary" id="retry-slide" type="button">重新加载</button>

          </figure>

          <p class="viewer-hint">可使用键盘左右方向键翻页；手机端可横向滑动缩略图。</p>
        </section>
      </main>

      <section class="opinions-section" id="owner-opinions" aria-labelledby="opinions-title">
        <header class="opinions-heading">
          <div>
            <span class="eyebrow">业主意见</span>
            <h2 id="opinions-title">对入口优化，你有什么建议？</h2>
          </div>
          <p>欢迎补充对安全、动线和造景品质的具体看法。房号用于确认业主身份，并在公开列表中直接显示。</p>
        </header>

        <div class="opinions-layout">
          <article class="opinion-compose" aria-labelledby="opinion-form-title">
            <h3 id="opinion-form-title">留下意见</h3>
            <form id="opinion-form" novalidate>
              <div class="field">
                <label for="opinion-residence">房号 <span aria-hidden="true">*</span></label>
                <input
                  id="opinion-residence"
                  name="residence"
                  type="text"
                  maxlength="80"
                  autocomplete="off"
                  placeholder="例如：3幢1单元1201室"
                  aria-describedby="opinion-residence-error"
                  required
                />
                <p class="field-error" id="opinion-residence-error" data-opinion-error-for="opinion-residence" aria-live="polite"></p>
              </div>

              <div class="field">
                <div class="field-label-row">
                  <label for="opinion-content">意见 <span aria-hidden="true">*</span></label>
                  <span id="opinion-counter" aria-live="polite">0 / 500</span>
                </div>
                <textarea
                  id="opinion-content"
                  name="content"
                  rows="6"
                  maxlength="500"
                  placeholder="例如：建议优先优化人车交叉位置，并在满足安全距离的前提下丰富入口造景。"
                  aria-describedby="opinion-content-error opinion-counter"
                  required
                ></textarea>
                <p class="field-error" id="opinion-content-error" data-opinion-error-for="opinion-content" aria-live="polite"></p>
              </div>

              <div class="opinion-honeypot" aria-hidden="true">
                <label for="opinion-website">网站</label>
                <input id="opinion-website" name="website" type="text" tabindex="-1" autocomplete="off" />
              </div>

              <p class="privacy-note">提交后，意见正文、完整房号和提交时间会公开展示；不收集姓名和联系方式。</p>
              <button class="button button-primary opinion-submit" id="opinion-submit" type="submit">提交意见</button>
              <div class="form-message" id="opinion-message" role="status" aria-live="polite"></div>
            </form>
          </article>

          <article class="opinion-feed" aria-labelledby="opinion-list-title">
            <div class="opinion-feed-header">
              <div>
                <h3 id="opinion-list-title">大家的意见</h3>
                <p id="opinion-count">正在读取…</p>
              </div>
              <button class="text-button" id="opinion-refresh" type="button">刷新</button>
            </div>

            <div class="opinion-list-loading" id="opinion-list-loading" role="status">正在加载意见…</div>
            <div class="opinion-list-state" id="opinion-list-empty" hidden>
              <strong>还没有公开意见</strong>
              <p>你可以成为第一个补充建议的人。</p>
            </div>
            <div class="opinion-list-state is-error" id="opinion-list-error" hidden>
              <strong>意见列表暂时没有加载成功</strong>
              <p>可以稍后重试，已填写的内容不会丢失。</p>
              <button class="button button-secondary" id="opinion-retry" type="button">重新加载</button>
            </div>
            <ol class="opinion-list" id="opinion-list" aria-live="polite"></ol>
          </article>
        </div>
      </section>
    </div>

    <noscript>
      <div class="noscript-message">浏览此材料需要启用 JavaScript，也可以直接下载 PPT 文件。</div>
    </noscript>
